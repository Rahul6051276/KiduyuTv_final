name: Android Release CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Phone and TV APKs
      run: ./gradlew assemblePhoneDebug assembleTvDebug --no-daemon

    - name: Upload Phone APK
      uses: actions/upload-artifact@v4
      with:
        name: phone-debug-apk
        path: app/build/outputs/apk/phone/debug/*.apk

    - name: Upload TV APK
      uses: actions/upload-artifact@v4
      with:
        name: tv-debug-apk
        path: app/build/outputs/apk/tv/debug/*.apk
