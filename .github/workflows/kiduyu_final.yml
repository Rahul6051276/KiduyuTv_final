name: Android Release CI

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write
  actions: write

jobs:
  prepare_release:
    name: Prepare Release Info
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      title: ${{ steps.commit_info.outputs.title }}
      short_sha: ${{ steps.commit_info.outputs.short_sha }}
      full_message: ${{ steps.commit_info.outputs.full_message }}
      build_count: ${{ github.run_number }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: true

      - name: Get commit info
        id: commit_info
        run: |
          FULL_MSG=$(git log -1 --pretty=%B | tr -d '\r')
          echo "full_message<<EOF" >> $GITHUB_OUTPUT
          echo "$FULL_MSG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          FIRST_LINE=$(git log -1 --pretty=%B | grep -m1 '[^[:space:]]' | sed 's/[[:space:]]*$//')
          echo "title=${FIRST_LINE}" >> $GITHUB_OUTPUT
          echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Determine Release Tag
        id: tag
        run: |
          LATEST=$(git tag --list 'v*.*.*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ -z "$LATEST" ]; then
            NEW_TAG="v1.1.1"
          else
            MAJOR=$(echo "$LATEST" | cut -d. -f1 | tr -d 'v')
            MINOR=$(echo "$LATEST" | cut -d. -f2)
            PATCH=$(echo "$LATEST" | cut -d. -f3)
            NEW_PATCH=$(( PATCH + 1 ))
            NEW_TAG="v${MAJOR}.${MINOR}.${NEW_PATCH}"
          fi
          echo "tag=${NEW_TAG}" >> $GITHUB_OUTPUT
          echo "Release tag: ${NEW_TAG}"

  build_apk:
    name: Build ${{ matrix.flavor }} APK
    runs-on: ubuntu-latest
    needs: [prepare_release]

    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: phone
            flavor_task: Phone
          - flavor: tv
            flavor_task: Tv

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Bump versionName and VERSION file
        run: |
          VERSION="${{ needs.prepare_release.outputs.tag }}"
          VERSION="${VERSION#v}"
          sed -i "s/versionName \"[^\"]*\"/versionName \"${VERSION}\"/" app/build.gradle
          echo "${VERSION}" > VERSION
          echo "Version set to ${VERSION}"

      - name: Build ${{ matrix.flavor }} Debug APK
        run: ./gradlew assemble${{ matrix.flavor_task }}Debug --build-cache --parallel -x lint -x test

      - name: Rename ${{ matrix.flavor }} APK
        id: rename_release
        run: |
          VERSION=$(grep 'versionName' app/build.gradle | sed 's/.*"\(.*\)".*/\1/' | tr -d '[:space:]')
          BUILD=${{ needs.prepare_release.outputs.build_count }}
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          NEW_APK_NAME="KiduyuTV-${{ matrix.flavor }}-${VERSION}-build${BUILD}.apk"
          NEW_APK_PATH="app/build/outputs/apk/$NEW_APK_NAME"
          mv "$APK" "$NEW_APK_PATH"
          echo "apk_path=$NEW_APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload ${{ matrix.flavor }} Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.flavor }}-apk
          path: ${{ steps.rename_release.outputs.apk_path }}

  create_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare_release, build_apk]

    steps:
      - name: Download Phone APK artifact
        uses: actions/download-artifact@v4
        with:
          name: phone-apk
          path: ./apks/phone

      - name: Download TV APK artifact
        uses: actions/download-artifact@v4
        with:
          name: tv-apk
          path: ./apks/tv

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare_release.outputs.tag }}
          name: "${{ needs.prepare_release.outputs.title }} — ${{ needs.prepare_release.outputs.tag }}"
          body: |
            ## KiduyuTV ${{ needs.prepare_release.outputs.tag }}
            Built automatically via GitHub Actions for Fork.
          files: |
            ./apks/phone/*.apk
            ./apks/tv/*.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
